<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | VIA Puente Académico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <i class="fa-solid fa-bridge"></i> VIA <span> Puente Académico</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html#inicio">Inicio</a></li>
            <li><a href="index.html#areas">Áreas Educativas</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="contacto.html" class="btn-primary-small">Contáctanos</a></li>
        </ul>
        <div class="menu-toggle" id="mobile-menu">
            <i class="fa-solid fa-bars"></i>
        </div>
    </nav>
    <section id="contacto" class="contacto-section">
        <div class="section-title">
            <h2>Hablemos de tu Proyecto</h2>
            <p>Déjanos tus datos y cuéntanos en qué podemos ayudarte. Te responderemos a la brevedad.</p>
        </div>
        
        <div class="form-container native-form-container">
            <form action="https://formspree.io/f/xvzylvdb" method="POST" class="custom-form">
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre completo:</label>
                        <input type="text" name="Nombre" placeholder="Ej. Ana Gómez" required>
                    </div>
                    <div class="form-group">
                        <label>Correo electrónico:</label>
                        <input type="email" name="Correo" placeholder="ana@correo.com" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Teléfono / WhatsApp:</label>
                        <input type="tel" name="Telefono" placeholder="+00 123 456 789" required>
                    </div>
                    <div class="form-group">
                        <label>Asunto (Materia o Servicio):</label>
                        <input type="text" name="Asunto" placeholder="Ej. Asesoría en Cálculo" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Enlace a tus documentos (Opcional):</label>
                    <input type="url" name="Documentos" placeholder="Pega tu enlace de Google Drive, Dropbox, etc.">
                    <small class="form-hint">Asegúrate de que el enlace no sea privado para poder revisarlo.</small>
                </div>

                <div class="form-group">
                    <label>Mensaje o detalles de tu solicitud:</label>
                    <textarea name="Mensaje" rows="5" placeholder="Cuéntanos más sobre lo que necesitas, fechas de entrega, etc..." required></textarea>
                </div>

                <button type="submit" class="btn-primary btn-submit-full">Enviar Mensaje</button>
            </form>
        </div>
    </section>

    <div class="floating-socials">
        <a href="https://instagram.com/tu_usuario" target="_blank" class="float-btn ig">
            <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://wa.me/1234567890" target="_blank" class="float-btn wa">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
